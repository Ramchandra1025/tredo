<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in · TRADO</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <nav class="nav"><a class="brand" href="/">TRADO<span>.</span></a><a href="/">Home</a></nav>
  <main class="auth-wrap auth-layout">
    <form class="panel auth-panel auth-form-panel" id="loginForm">
      <div class="eyebrow">WELCOME BACK</div>
      <h1>Log in</h1>
      <label>Email address<input type="email" id="email" required autocomplete="email"></label>
      <label>Password<input type="password" id="password" required autocomplete="current-password"></label>
      <div class="login-options">
        <label class="remember-check"><input type="checkbox" id="remember"> Keep me signed in</label>
        <button id="forgotPassword" class="text-button" type="button">Forgot password?</button>
      </div>
      <button class="btn full" type="submit">Log in</button>
      <p id="message" class="message" role="status"></p>
      <p class="muted">New here? <a href="/register.html">Create an account</a></p>
    </form>
    <aside class="auth-visual">
      <div>
        <div class="eyebrow">WELCOME TO TRADO</div>
        <h2>Keep your learning journey moving forward.</h2>
        <p>Build market knowledge one clear, practical lesson at a time.</p>
      </div>
      <p class="visual-caption">A little curiosity can take you a long way.</p>
    </aside>
  </main>
  <script src="/static/js/auth.js"></script>
</body>
</html>
