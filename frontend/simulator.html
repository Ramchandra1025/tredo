<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper trading • TRADO</title><link rel="stylesheet" href="/static/css/style.css"></head><body><nav class="nav"><a class="brand" href="/">TRADO<span>.</span></a><div><a href="/dashboard.html">Dashboard</a><a href="/learning.html">Learn</a></div></nav><main class="page"><div class="eyebrow">PRACTISE WITHOUT REAL MONEY</div><h1>Virtual trading simulator</h1><p class="muted">This is a simple paper-trade ledger. Enter your own hypothetical price; it is not live market data.</p><section class="stats"><article><small>VIRTUAL CASH</small><strong id="cash">₹10,000</strong></article></section><form id="tradeForm" class="panel trade-form"><label>Symbol<input id="symbol" placeholder="e.g. DEMO" required maxlength="12"></label><label>Side<select id="side"><option>BUY</option><option>SELL</option></select></label><label>Quantity<input id="quantity" type="number" min="0.01" step="0.01" required></label><label>Hypothetical price<input id="price" type="number" min="0.01" step="0.01" required></label><button class="btn">Record virtual trade</button><p id="message" class="message"></p></form><section class="panel"><h2>Trade history</h2><div class="table-wrap"><table><thead><tr><th>Time</th><th>Symbol</th><th>Side</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead><tbody id="trades"></tbody></table></div></section></main><script src="/static/js/simulator.js"></script></body></html>
