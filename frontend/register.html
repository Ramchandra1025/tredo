<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join TRADO</title><link rel="stylesheet" href="/static/css/style.css"></head>
<body><nav class="nav"><a class="brand" href="/">TRADO<span>.</span></a><a href="/">Home</a></nav>
<main class="auth-wrap"><form class="panel auth-panel" id="registerForm"><div class="eyebrow">YOUR LEARNING JOURNEY STARTS HERE</div><h1>Create account</h1>
  <label>Full name<input type="text" id="name" required maxlength="60" autocomplete="name"></label>
  <label>Email address<input type="email" id="email" required autocomplete="email"></label>
  <label>Trader type<select id="traderType" required><option value="beginner">Beginner Trader</option><option value="intraday">Intraday Trader</option><option value="swing">Swing Trader</option><option value="options">Options Trader</option><option value="long_term">Long-Term Investor</option></select></label>
  <label>Password<span class="password-wrap"><input type="password" id="password" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" data-toggle-password="password" aria-label="Show password">Show</button></span></label>
  <label>Confirm password<span class="password-wrap"><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password"><button class="password-toggle" type="button" data-toggle-password="confirmPassword" aria-label="Show confirmation password">Show</button></span></label>
  <label class="terms-check"><input type="checkbox" id="termsAccepted" required><span>I agree to the <a href="/terms.html" target="_blank" rel="noopener">terms of use</a> and understand TRADO is for education, not investment advice.</span></label>
  <button class="btn full" type="submit">Create account</button><p id="message" class="message" role="status"></p>
  <p class="muted">Already registered? <a href="/login.html">Log in</a></p></form></main><script src="/static/js/auth.js"></script></body></html>
